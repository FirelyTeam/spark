services:
  spark:
    container_name: spark
    image: ${SPARK_IMAGE:-sparkfhir/spark:r4-latest}
    environment:
      - StoreSettings__ConnectionString=mongodb://root:secret@mongodb:27017/spark?authSource=admin
      - SparkSettings__Endpoint=http://spark:8080/fhir
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_HTTP_PORT=8080
    ports:
      - "8000:8080"
      - "8001:8081"
    depends_on:
      mongodb:
        condition: service_healthy
  mongodb:
    container_name: mongodb
    image: ${MONGO_IMAGE:-sparkfhir/mongo:r4-latest}
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host localhost --port 27017 -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'",
        ]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    ports:
      - "17017:27017"
  plan_executor:
    container_name: plan_executor
    image: incendi/plan_executor@sha256:3c6547c58c3800e642a487cc70c6c88640c9ebc572c737f884d5b41b8527407c
    depends_on:
      - spark
    volumes:
      - ./logs:/app/logs:rw
      - ./html_summaries:/app/html_summaries:rw
      - ./json_results:/app/json_results:rw
