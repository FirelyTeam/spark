services:  
  spark:
    container_name: spark
    restart: always
    image: sparkfhir/spark:r5-latest
    environment:
      - StoreSettings__ConnectionString=mongodb://root:CosmicTopSecret@mongodb:27017/spark?authSource=admin
      - SparkSettings__Endpoint=http://localhost:5555/fhir
    ports:
      - "5555:80"
    depends_on:
      - mongodb
  mongodb:
    container_name: mongodb
    image: sparkfhir/mongo:r5-latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: CosmicTopSecret
    ports:
      - "17017:27017"
    volumes:
      - r5-latest-develop-data-volume:/data/db
volumes:
  r5-latest-develop-data-volume:
