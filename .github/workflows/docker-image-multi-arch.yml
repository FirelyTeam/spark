name: Docker Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'FirelyTeam/spark'
    name: Docker Release (${{ matrix.fhir-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - fhir-version: r6
            spark-dockerfile: .docker/linux/Spark.R6.Dockerfile
            mongo-dockerfile: .docker/linux/Mongo.R6.Dockerfile
          - fhir-version: r5
            spark-dockerfile: .docker/linux/Spark.R5.Dockerfile
            mongo-dockerfile: .docker/linux/Mongo.R5.Dockerfile
          - fhir-version: r4b
            spark-dockerfile: .docker/linux/Spark.R4B.Dockerfile
            mongo-dockerfile: .docker/linux/Mongo.R4B.Dockerfile
          - fhir-version: r4
            spark-dockerfile: .docker/linux/Spark.R4.Dockerfile
            mongo-dockerfile: .docker/linux/Mongo.R4.Dockerfile
          - fhir-version: stu3
            spark-dockerfile: .docker/linux/Spark.STU3.Dockerfile
            mongo-dockerfile: .docker/linux/Mongo.STU3.Dockerfile

    steps:
      -
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Set up QEMU for cross-platform builds (ARM64 emulation on AMD64 runner)
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Set up Docker Buildx for multi-platform builds
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      -
        name: Login to DockerHub Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      -
        name: Get the version
        id: vars
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      -
        name: Docker meta (Spark)
        id: meta_spark
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ secrets.DOCKERHUB_ORGANIZATION }}/spark
            ${{ secrets.DOCKERHUB_ORGANIZATION_2 }}/spark
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}-${{ matrix.fhir-version }}
            type=raw,value=${{ matrix.fhir-version }}-latest,enable=${{ github.event.release.prerelease == false }}

      -
        name: Build and push Spark Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.spark-dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_spark.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      -
        name: Docker meta (Mongo)
        id: meta_mongo
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ secrets.DOCKERHUB_ORGANIZATION }}/mongo
            ${{ secrets.DOCKERHUB_ORGANIZATION_2 }}/mongo
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}-${{ matrix.fhir-version }}
            type=raw,value=${{ matrix.fhir-version }}-latest,enable=${{ github.event.release.prerelease == false }}

      -
        name: Download MongoDB fixture
        run: ./.docker/linux/download-database-fixtures.sh "${{ matrix.fhir-version }}"

      -
        name: Build and push Mongo Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.mongo-dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_mongo.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
