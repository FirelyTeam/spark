name: Release

on:
  release:
    types: [published]

jobs:
  build:
    if: github.repository == 'FirelyTeam/spark'

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET Core
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: |
          dotnet pack "./src/Spark.Engine/Spark.Engine.csproj" -c Release
          dotnet pack "./src/Spark.Mongo/Spark.Mongo.csproj" -c Release
      - name: Deploy Nuget Packages
        run: dotnet nuget push .\src\**\*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate
          --source https://api.nuget.org/v3/index.json
          --no-symbols
